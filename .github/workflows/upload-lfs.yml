name: Upload qzd v6 packages to Git LFS

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/lfs-qzd-v6-320e

permissions:
  contents: write

concurrency:
  group: upload-qzd-v6-lfs
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Assemble zips and push Git LFS objects to main
        env:
          GIT_AUTHOR_NAME: Cursor Agent
          GIT_AUTHOR_EMAIL: cursoragent@cursor.com
          GIT_COMMITTER_NAME: Cursor Agent
          GIT_COMMITTER_EMAIL: cursoragent@cursor.com
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          trap 'echo "::error::failed line ${LINENO}: ${BASH_COMMAND}"' ERR
          df -h
          echo "::notice::checking git lfs"
          if ! git lfs version; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq git-lfs
            git lfs version
          fi
          git lfs install
          git config user.name "Cursor Agent"
          git config user.email "cursoragent@cursor.com"

          core_n=$(find transfer/v6_core -name 'qzd_db_v6_core.part*' | wc -l)
          extra_n=$(find transfer/v6_extra -name 'qzd_db_v6_extra.part*' | wc -l)
          echo "::notice::chunks core=${core_n} extra=${extra_n}"
          test "$core_n" -eq 84
          test "$extra_n" -eq 48
          test -f transfer/v6_core/qzd_db_v6_core.part083
          test -f transfer/v6_extra/qzd_db_v6_extra.part047
          test -f transfer/v6_core/MANIFEST_core.txt
          test -f transfer/v6_extra/MANIFEST_extra.txt

          core_bytes=$(awk -F= '/^bytes=/{print $2; exit}' transfer/v6_core/MANIFEST_core.txt)
          core_sha=$(awk -F= '/^sha256=/{print $2; exit}' transfer/v6_core/MANIFEST_core.txt)
          core_parts=$(awk -F= '/^parts=/{print $2; exit}' transfer/v6_core/MANIFEST_core.txt)
          extra_bytes=$(awk -F= '/^bytes=/{print $2; exit}' transfer/v6_extra/MANIFEST_extra.txt)
          extra_sha=$(awk -F= '/^sha256=/{print $2; exit}' transfer/v6_extra/MANIFEST_extra.txt)
          extra_parts=$(awk -F= '/^parts=/{print $2; exit}' transfer/v6_extra/MANIFEST_extra.txt)
          test "$core_bytes" = "1760545664"
          test "$core_sha" = "1d4395808f93724a42c0c3dcb2af8b3711bf3be110b91fb6e3ba89a9f4fcb619"
          test "$core_parts" = "84"
          test "$extra_bytes" = "986819191"
          test "$extra_sha" = "1c4728124cc159d6ff469e2a0b10898c34c3ce03c8da3cd6608681874a419c06"
          test "$extra_parts" = "48"

          echo "::notice::assembling qzd_db.zip"
          : > /tmp/qzd_db.zip
          for i in $(seq 0 83); do
            printf -v n '%03d' "$i"
            cat "transfer/v6_core/qzd_db_v6_core.part${n}" >> /tmp/qzd_db.zip
          done
          rm -rf transfer/v6_core
          echo "::notice::assembling qzd_db_company_csv.zip"
          : > /tmp/qzd_db_company_csv.zip
          for i in $(seq 0 47); do
            printf -v n '%03d' "$i"
            cat "transfer/v6_extra/qzd_db_v6_extra.part${n}" >> /tmp/qzd_db_company_csv.zip
          done
          rm -rf transfer
          df -h

          test "$(stat -c%s /tmp/qzd_db.zip)" = "$core_bytes"
          test "$(stat -c%s /tmp/qzd_db_company_csv.zip)" = "$extra_bytes"
          echo "${core_sha}  /tmp/qzd_db.zip" | sha256sum -c -
          echo "${extra_sha}  /tmp/qzd_db_company_csv.zip" | sha256sum -c -

          echo "::notice::checking out main"
          git fetch origin main
          git checkout -f -B main origin/main
          mv /tmp/qzd_db.zip qzd_db.zip
          mv /tmp/qzd_db_company_csv.zip qzd_db_company_csv.zip
          rm -rf transfer
          test ! -e transfer
          test -d extraction
          test -f extraction/README.md
          test -f extraction/SCHEMA.md
          test -f extraction/progress.md
          test -f extraction/examples/zhonglin_group_materials.json
          extraction_tree=$(git rev-parse HEAD:extraction)
          df -h

          python3 - << 'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text()
          replacements = [
              (
                  "1,944,406,384 字节，sha256 `2becd0c3becafa66a6dd33cbc40b883bcea88e2a88e454d44f8c2b8081fcb8af`",
                  "1,760,545,664 字节，sha256 `1d4395808f93724a42c0c3dcb2af8b3711bf3be110b91fb6e3ba89a9f4fcb619`",
              ),
              (
                  "986,839,385 字节，sha256 `61048532ee974233e3e1f37244030decd10971294e58f7a8ba3ddd9caa7b257b`",
                  "986,819,191 字节，sha256 `1c4728124cc159d6ff469e2a0b10898c34c3ce03c8da3cd6608681874a419c06`",
              ),
              ("| 企业 | 9,221,636 |", "| 企业 | 9,221,952 |"),
              ("| 苏州（city） | 25,834 |", "| 苏州（city） | 26,150 |"),
              ("| company_list | 44,619 |", "| company_list | 45,720 |"),
              ("| 政策 | 27,637 |", "| 政策 | 27,703 |"),
              ("合计详情成功 **27637** 条", "合计详情成功 **27703** 条"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"README missing expected text: {old}")
              text = text.replace(old, new, 1)
          required = [
              "1,760,545,664",
              "1d4395808f93724a42c0c3dcb2af8b3711bf3be110b91fb6e3ba89a9f4fcb619",
              "986,819,191",
              "1c4728124cc159d6ff469e2a0b10898c34c3ce03c8da3cd6608681874a419c06",
              "| 企业 | 9,221,952 |",
              "| 苏州（city） | 26,150 |",
              "| company_list | 45,720 |",
              "| 政策 | 27,703 |",
              "合计详情成功 **27703** 条",
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f"README missing updated text: {item}")
          stale = [
              "2becd0c3becafa66a6dd33cbc40b883bcea88e2a88e454d44f8c2b8081fcb8af",
              "61048532ee974233e3e1f37244030decd10971294e58f7a8ba3ddd9caa7b257b",
              "9,221,636",
              "25,834",
              "44,619",
              "27,637",
              "**27637**",
          ]
          for item in stale:
              if item in text:
                  raise SystemExit(f"README still contains stale text: {item}")
          path.write_text(text)
          print("README updated for v6")
          PY

          git lfs track "*.zip"
          git add .gitattributes README.md qzd_db.zip qzd_db_company_csv.zip
          if git diff --cached --name-only | grep -q '^extraction/'; then
            echo "::error::refusing to commit extraction/"
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^transfer/'; then
            echo "::error::refusing to commit transfer shards"
            exit 1
          fi
          git cat-file -p :qzd_db.zip | grep -q "oid sha256:${core_sha}"
          git cat-file -p :qzd_db_company_csv.zip | grep -q "oid sha256:${extra_sha}"
          for f in qzd_db.zip qzd_db_company_csv.zip; do
            pointer_size=$(git cat-file -s ":$f")
            echo "::notice::pointer ${f} bytes ${pointer_size}"
            test "$pointer_size" -lt 200
          done
          git commit -m "通过 Git LFS 发布 v6 的 qzd_db.zip 与 qzd_db_company_csv.zip" -m "qzd_db.zip 1760545664 字节，sha256 1d4395808f93724a42c0c3dcb2af8b3711bf3be110b91fb6e3ba89a9f4fcb619（由 qzd_db_v6_core 分片拼接：dump、脚本，以及除 company.csv.gz 外的 CSV）。qzd_db_company_csv.zip 986819191 字节，sha256 1c4728124cc159d6ff469e2a0b10898c34c3ce03c8da3cd6608681874a419c06（由 qzd_db_v6_extra 分片拼接，仅 company.csv.gz）。企业 9221952，苏州 26150，company_list 45720，政策 27703。仓库中不保留分片，extraction/ 未改。"
          test "$(git rev-parse HEAD:extraction)" = "$extraction_tree"
          if git ls-tree -r --name-only HEAD | grep -q '^transfer/'; then
            echo "::error::main commit contains transfer shards"
            exit 1
          fi
          echo "::notice::pushing main"
          git push origin HEAD:main
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          echo "::notice::pushed ${local_sha} remote ${remote_sha}"
          test "$local_sha" = "$remote_sha"
